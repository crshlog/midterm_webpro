kind: wasmer.io/App.v0
package: crshlog/midterm_webpro

# Opsional: Jika Anda menggunakan Managed Database dari Wasmer
capabilities:
  database:
    engine: mysql # atau postgresql tergantung database Anda

# Konfigurasi Jobs untuk Migrasi Otomatis sebelum Deploy
jobs:
  - name: laravel-migration
    trigger: pre-deployment
    action:
      execute:
        # Memanggil PHP artisan migrate --force
        cli_args:
          - "artisan"
          - "migrate"
          - "--force"
