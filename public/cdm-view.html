<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conceptual Data Model (CDM) — Freelance Job Board</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #04060f;
      color: #f3f6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 16px;
      text-align: left;
    }
    h1 {
      font-size: 22px;
      color: #5df0a8;
      margin: 0 0 6px 0;
      letter-spacing: 0.02em;
    }
    p {
      color: #9aa6c4;
      font-size: 13.5px;
      margin: 0;
    }
    svg {
      width: 100%;
      max-width: 1100px;
      height: auto;
      background: #060a18;
      border: 1px solid rgba(150, 175, 230, 0.22);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>1. Conceptual Data Model (CDM) — Entity-Relationship Architecture</h1>
    <p>Ascend Freelance Job Board &amp; Candidate Portal (EF234301 Web Programming)</p>
  </div>

  <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
      </filter>
    </defs>

    <!-- USERS to EMPLOYERS -->
    <path d="M 230 200 L 400 200" stroke="#5df0a8" stroke-width="2" fill="none" />
    <polygon points="315,185 335,200 315,215 295,200" fill="#0f172a" stroke="#5df0a8" stroke-width="1.5" />
    <text x="315" y="204" fill="#5df0a8" font-size="10" font-weight="bold" text-anchor="middle">Operates</text>
    <text x="245" y="192" fill="#9aa6c4" font-size="12" font-weight="bold">1</text>
    <text x="385" y="192" fill="#9aa6c4" font-size="12" font-weight="bold">1</text>

    <!-- EMPLOYERS to JOB_POSTINGS -->
    <path d="M 525 300 L 525 370" stroke="#5df0a8" stroke-width="2" fill="none" />
    <polygon points="525,325 545,340 525,355 505,340" fill="#0f172a" stroke="#5df0a8" stroke-width="1.5" />
    <text x="525" y="344" fill="#5df0a8" font-size="10" font-weight="bold" text-anchor="middle">Publishes</text>
    <text x="535" y="315" fill="#9aa6c4" font-size="12" font-weight="bold">1</text>
    <text x="535" y="365" fill="#9aa6c4" font-size="12" font-weight="bold">N</text>

    <!-- JOB_POSTINGS to JOB_APPLICATIONS -->
    <path d="M 640 460 L 760 460" stroke="#5df0a8" stroke-width="2" fill="none" />
    <polygon points="700,445 720,460 700,475 680,460" fill="#0f172a" stroke="#5df0a8" stroke-width="1.5" />
    <text x="700" y="464" fill="#5df0a8" font-size="10" font-weight="bold" text-anchor="middle">Receives</text>
    <text x="655" y="452" fill="#9aa6c4" font-size="12" font-weight="bold">1</text>
    <text x="745" y="452" fill="#9aa6c4" font-size="12" font-weight="bold">N</text>

    <!-- USERS to JOB_APPLICATIONS -->
    <path d="M 130 330 C 130 570, 870 570, 870 520" stroke="#9fc4ff" stroke-width="1.8" stroke-dasharray="4" fill="none" />
    <text x="500" y="560" fill="#9fc4ff" font-size="11" font-weight="bold" text-anchor="middle">Submits Pitch &amp; CV (1:N)</text>

    <!-- USERS to BOOKMARKS -->
    <path d="M 130 110 C 130 40, 870 40, 870 110" stroke="#ffd27a" stroke-width="1.8" stroke-dasharray="4" fill="none" />
    <text x="500" y="55" fill="#ffd27a" font-size="11" font-weight="bold" text-anchor="middle">Saves to Watchlist (1:N)</text>

    <!-- JOB_POSTINGS to BOOKMARKS -->
    <path d="M 640 400 C 740 400, 870 300, 870 200" stroke="#ffd27a" stroke-width="1.8" stroke-dasharray="4" fill="none" />
    <text x="800" y="320" fill="#ffd27a" font-size="11" font-weight="bold">Bookmarked In</text>

    <!-- Entity: USERS -->
    <g transform="translate(30, 110)" filter="url(#shadow)">
      <rect width="200" height="200" rx="8" fill="#101830" stroke="#5df0a8" stroke-width="2"/>
      <path d="M 0 32 L 200 32" stroke="rgba(150,175,230,.2)" stroke-width="1.5"/>
      <text x="100" y="22" fill="#5df0a8" font-weight="bold" font-size="13" text-anchor="middle">USERS</text>
      <text x="15" y="55" fill="#f3f6ff" font-size="12">• id (Identifier)</text>
      <text x="15" y="77" fill="#9aa6c4" font-size="12">• name</text>
      <text x="15" y="99" fill="#9aa6c4" font-size="12">• email</text>
      <text x="15" y="121" fill="#9aa6c4" font-size="12">• password</text>
      <text x="15" y="143" fill="#9aa6c4" font-size="12">• role (freelancer/emp)</text>
      <text x="15" y="165" fill="#9aa6c4" font-size="12">• phone</text>
      <text x="15" y="187" fill="#9aa6c4" font-size="12">• timestamps</text>
    </g>

    <!-- Entity: EMPLOYERS -->
    <g transform="translate(400, 110)" filter="url(#shadow)">
      <rect width="250" height="190" rx="8" fill="#101830" stroke="#5df0a8" stroke-width="2"/>
      <path d="M 0 32 L 250 32" stroke="rgba(150,175,230,.2)" stroke-width="1.5"/>
      <text x="125" y="22" fill="#5df0a8" font-weight="bold" font-size="13" text-anchor="middle">EMPLOYERS</text>
      <text x="15" y="55" fill="#f3f6ff" font-size="12">• id (Identifier)</text>
      <text x="15" y="77" fill="#9aa6c4" font-size="12">• company_name</text>
      <text x="15" y="99" fill="#9aa6c4" font-size="12">• industry</text>
      <text x="15" y="121" fill="#9aa6c4" font-size="12">• website</text>
      <text x="15" y="143" fill="#9aa6c4" font-size="12">• bio</text>
      <text x="15" y="165" fill="#9aa6c4" font-size="12">• logo_image, socials</text>
    </g>

    <!-- Entity: JOB_POSTINGS -->
    <g transform="translate(400, 370)" filter="url(#shadow)">
      <rect width="250" height="210" rx="8" fill="#101830" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 0 32 L 250 32" stroke="rgba(150,175,230,.2)" stroke-width="1.5"/>
      <text x="125" y="22" fill="#38bdf8" font-weight="bold" font-size="13" text-anchor="middle">JOB_POSTINGS</text>
      <text x="15" y="55" fill="#f3f6ff" font-size="12">• id (Identifier)</text>
      <text x="15" y="77" fill="#9aa6c4" font-size="12">• title</text>
      <text x="15" y="99" fill="#9aa6c4" font-size="12">• job_type (Remote/On-site..)</text>
      <text x="15" y="121" fill="#9aa6c4" font-size="12">• budget</text>
      <text x="15" y="143" fill="#9aa6c4" font-size="12">• deadline</text>
      <text x="15" y="165" fill="#9aa6c4" font-size="12">• requirements</text>
      <text x="15" y="187" fill="#9aa6c4" font-size="12">• is_active</text>
    </g>

    <!-- Entity: BOOKMARKS -->
    <g transform="translate(760, 110)" filter="url(#shadow)">
      <rect width="220" height="110" rx="8" fill="#101830" stroke="#ffd27a" stroke-width="2"/>
      <path d="M 0 32 L 220 32" stroke="rgba(150,175,230,.2)" stroke-width="1.5"/>
      <text x="110" y="22" fill="#ffd27a" font-weight="bold" font-size="13" text-anchor="middle">BOOKMARKS</text>
      <text x="15" y="55" fill="#f3f6ff" font-size="12">• id (Identifier)</text>
      <text x="15" y="77" fill="#9aa6c4" font-size="12">• [user_id + job_id] Watchlist</text>
      <text x="15" y="99" fill="#9aa6c4" font-size="12">• created_at</text>
    </g>

    <!-- Entity: JOB_APPLICATIONS -->
    <g transform="translate(760, 370)" filter="url(#shadow)">
      <rect width="220" height="170" rx="8" fill="#101830" stroke="#5df0a8" stroke-width="2"/>
      <path d="M 0 32 L 220 32" stroke="rgba(150,175,230,.2)" stroke-width="1.5"/>
      <text x="110" y="22" fill="#5df0a8" font-weight="bold" font-size="13" text-anchor="middle">JOB_APPLICATIONS</text>
      <text x="15" y="55" fill="#f3f6ff" font-size="12">• id (Identifier)</text>
      <text x="15" y="77" fill="#9aa6c4" font-size="12">• cover_letter (pitch)</text>
      <text x="15" y="99" fill="#9aa6c4" font-size="12">• portfolio_url</text>
      <text x="15" y="121" fill="#9aa6c4" font-size="12">• cv_file (PDF)</text>
      <text x="15" y="143" fill="#9aa6c4" font-size="12">• status (Pending..Hired)</text>
    </g>
  </svg>
</body>
</html>
